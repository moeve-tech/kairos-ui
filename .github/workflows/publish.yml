name: Publish package

# Fires when you push a version tag (created by `npm version patch/minor/major`,
# which also tags the commit - see README "Publishing a new version").
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # required for npm Trusted Publishing (OIDC) - no npm token/secret needed

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # actions/setup-node installs whatever npm ships bundled with this Node
      # version, which can be older than what Trusted Publishing (OIDC) needs.
      # Force a recent npm so the OIDC exchange during `npm publish` is supported.
      - run: npm install -g npm@latest
      - run: npm --version

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance
